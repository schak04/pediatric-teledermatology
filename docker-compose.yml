services:
    app:
        build: .
        image: teledermpeds:latest
        container_name: teledermpeds
        restart: unless-stopped
        ports:
            - "10005:80"
        env_file:
            - .env
        volumes:
            - sqlite-data:/var/www/html/database
            - storage-data:/var/www/html/storage/app

volumes:
    sqlite-data:
    storage-data:
